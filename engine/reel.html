<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;font-family:'Manrope',sans-serif;overflow:hidden}
.ink{background:#101418;color:#F2EFE8}
.paper{background:#F2EFE8;color:#101418}
#glow{position:absolute;width:1400px;height:1400px;border-radius:50%;left:-160px;top:-200px;
  background:radial-gradient(circle, rgba(212,255,63,.16), rgba(212,255,63,0) 60%)}
.paper #glow{background:radial-gradient(circle, rgba(212,255,63,.30), rgba(212,255,63,0) 60%)}
#brand{position:absolute;top:92px;left:84px;display:flex;align-items:center;gap:18px;z-index:5}
#brand svg{width:46px;height:52px;display:block}
#brand .wm{font-family:'Montserrat';font-weight:800;font-size:30px;letter-spacing:.14em}
#card{position:absolute;left:84px;right:84px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:flex-start;gap:34px}
.kicker{font-family:'Montserrat';font-weight:800;font-size:30px;letter-spacing:.22em;
  background:#D4FF3F;color:#101418;padding:14px 26px;border-radius:999px;display:inline-block}
.title{font-family:'Bricolage Grotesque';font-weight:800;font-size:132px;line-height:.96;letter-spacing:-.03em}
.title .ln{display:block}
.badge{font-family:'Bricolage Grotesque';font-weight:800;font-size:150px;color:#D4FF3F;line-height:.9}
.paper .badge,.paper .big{color:#101418;text-shadow:0 0 0 #D4FF3F;-webkit-text-stroke:0}
.statement{font-family:'Bricolage Grotesque';font-weight:800;font-size:112px;line-height:1;letter-spacing:-.02em}
.big{font-family:'Bricolage Grotesque';font-weight:800;font-size:300px;line-height:.86;color:#D4FF3F;letter-spacing:-.04em}
.biglabel{font-family:'Manrope';font-weight:700;font-size:58px;line-height:1.12}
.check{display:flex;align-items:center;gap:30px;font-family:'Manrope';font-weight:800;font-size:72px;line-height:1.02}
.check .mk{flex:0 0 auto;width:78px;height:78px;border-radius:50%;background:#D4FF3F;color:#101418;
  display:flex;align-items:center;justify-content:center;font-size:48px}
#card.ctacard{align-items:center;text-align:center;gap:40px}
.ctalogo{width:150px;height:170px}
.ctahead{font-family:'Bricolage Grotesque';font-weight:800;font-size:96px;line-height:.98;letter-spacing:-.02em}
.ctapill{font-family:'Montserrat';font-weight:800;font-size:64px;letter-spacing:.06em;background:#D4FF3F;color:#101418;padding:22px 54px;border-radius:999px}
.ctameta{font-family:'Manrope';font-weight:700;font-size:44px;opacity:.85;line-height:1.5}
/* avant / après */
.ba{display:flex;flex-direction:column;gap:40px;width:100%}
.baItem{display:flex;flex-direction:column;gap:18px}
.batag{font-family:'Montserrat';font-weight:800;font-size:30px;letter-spacing:.2em;padding:10px 24px;border-radius:999px;align-self:flex-start}
.batag.bad{background:#C9CDC7;color:#101418}.batag.good{background:#D4FF3F;color:#101418}
.mock{border-radius:26px;overflow:hidden;position:relative;height:320px;border:2px solid rgba(255,255,255,.10)}
.mock.bad{background:#E7E4DC}.mock.good{background:#171C22}
.mockbar{height:56px;display:flex;align-items:center;gap:13px;padding:0 24px;background:rgba(0,0,0,.10)}
.dot{width:16px;height:16px;border-radius:50%;background:#B9BDB7}
.mockbody{position:relative;padding:36px}
.gl{height:28px;border-radius:9px;background:#CFC9BE;margin-bottom:20px}
.mock.good .gl{background:#2A313A}
.gpill{height:40px;width:150px;border-radius:999px;background:#D4FF3F;margin-top:8px}
.badgeico{position:absolute;right:30px;bottom:28px;width:92px;height:92px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800}
.badgeico.x{background:#E5484D;color:#fff}.badgeico.v{background:#D4FF3F;color:#101418}
/* démo site */
#demo{position:absolute;left:84px;right:84px;top:520px;border-radius:28px;overflow:hidden;display:none;
  border:2px solid rgba(255,255,255,.12);box-shadow:0 40px 90px rgba(0,0,0,.5);background:#0C0F13;z-index:3}
#demo .bar{height:62px;background:#1A2026;display:flex;align-items:center;gap:14px;padding:0 28px}
#demo .bar .d{width:17px;height:17px;border-radius:50%;background:#3A424C}
#demo .url{margin-left:18px;flex:1;height:34px;border-radius:999px;background:#0C0F13;display:flex;align-items:center;padding:0 22px;font-size:26px;color:#9AA2AB;font-weight:600}
#demo .screen{position:relative;height:700px;overflow:hidden}
#demo video{width:100%;height:100%;object-fit:cover;object-position:top}
#sub{position:absolute;left:70px;right:70px;bottom:190px;text-align:center;z-index:6}
#sub span{display:inline;font-family:'Manrope';font-weight:800;font-size:52px;line-height:1.45;
  background:#101418;color:#fff;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 20px 12px;border-radius:14px}
#bar{position:absolute;left:0;bottom:0;height:12px;background:#D4FF3F;width:0;z-index:7}
</style></head>
<body>
<div id="stage" class="ink">
  <div id="glow"></div>
  <div id="brand">
    <svg viewBox="0 0 100 112" fill="none"><path d="M50 4 L92 108 H64 L50 70 L36 108 H8 Z" fill="#D4FF3F"/><path d="M50 4 L50 52 M34 30 L50 10 L66 30" stroke="#101418" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="wm">ARIAN STUDIO</div>
  </div>
  <div id="demo"><div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><div class="url" id="url"></div></div><div class="screen"><video id="dv" muted playsinline preload="auto"></video></div></div>
  <div id="card"></div>
  <div id="sub"><span></span></div>
  <div id="bar"></div>
</div>
<script>
// Spec passée via ?spec=<json url-encodé> par render.py
const R=JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get('spec')));
const stage=document.getElementById('stage'),card=document.getElementById('card'),sub=document.querySelector('#sub span'),
  bar=document.getElementById('bar'),glow=document.getElementById('glow'),demo=document.getElementById('demo'),dv=document.getElementById('dv');
stage.className=R.theme||'ink';
document.querySelector('#brand .wm').style.color=(R.theme==='paper')?'#101418':'#F2EFE8';
let tt=0;const cards=R.cards.map(c=>{const o={...c,t0:tt,t1:tt+c.t};tt+=c.t;return o;});
window.DURATION=tt;
const LOGO=`<svg class="ctalogo row" data-i="0" viewBox="0 0 100 112" fill="none"><path d="M50 4 L92 108 H64 L50 70 L36 108 H8 Z" fill="#D4FF3F"/><path d="M50 4 L50 52 M34 30 L50 10 L66 30" stroke="#101418" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const br=s=>(s||'').replace(/\n/g,'<br>');
function html(c){
  if(c.type==='hook') return `${c.kicker?`<div class="kicker row" data-i="0">${c.kicker}</div>`:''}<div class="title">${c.title.split('\n').map((l,i)=>`<span class="ln row" data-i="${i+1}">${l}</span>`).join('')}</div>`;
  if(c.type==='lines'){
    if(c.num) return `<div class="badge row" data-i="0">${c.num}</div><div class="statement row" data-i="1">${br(c.items[0])}</div>`;
    return c.items.map((it,i)=>`<div class="check row" data-i="${i}"><div class="mk">✓</div><div>${br(it)}</div></div>`).join('');
  }
  if(c.type==='big') return `<div class="big row" data-i="0">${c.big}</div><div class="biglabel row" data-i="1">${br(c.label)}</div>`;
  if(c.type==='beforeafter') return `<div class="ba">
    <div class="baItem row" data-i="0"><div class="batag bad">AVANT</div><div class="mock bad"><div class="mockbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="mockbody"><div class="gl" style="width:78%"></div><div class="gl" style="width:95%"></div><div class="gl" style="width:46%"></div><div class="badgeico x">✕</div></div></div></div>
    <div class="baItem row" data-i="1"><div class="batag good">APRÈS</div><div class="mock good"><div class="mockbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="mockbody"><div class="gl" style="width:64%"></div><div class="gl" style="width:88%"></div><div class="gpill"></div><div class="badgeico v">✓</div></div></div></div></div>`;
  if(c.type==='demo') return c.kicker?`<div class="kicker row" data-i="0">${c.kicker}</div>`:'';
  if(c.type==='cta') return `${LOGO}<div class="ctahead row" data-i="1">${c.head||'Commentez'}</div><div class="ctapill row" data-i="2">« ${R.keyword||'SITE'} »</div><div class="ctameta row" data-i="3">arianstudio.fr<br>arianstudio31@gmail.com</div>`;
  return '';
}
let cur=-1;const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
window.ready=new Promise(res=>{
  const d=cards.find(c=>c.type==='demo');
  if(!d){res(1);return;}
  document.getElementById('url').textContent=d.url||'';
  dv.src=d.video; dv.addEventListener('loadeddata',()=>res(1),{once:true}); dv.addEventListener('error',()=>res(0),{once:true});
});
window.renderFrame=async function(t){
  t=Math.max(0,Math.min(t,DURATION-0.001));
  glow.style.transform=`translate(${Math.sin(t*.4)*120}px,${Math.cos(t*.33)*90}px)`;
  bar.style.width=(t/DURATION*1080)+'px';
  let i=cards.findIndex(c=>t>=c.t0&&t<c.t1);if(i<0)i=cards.length-1;const c=cards[i];
  if(i!==cur){cur=i;card.className=c.type==='cta'?'ctacard':'';card.innerHTML=html(c);card._rows=[...card.querySelectorAll('.row')];
    if(c.type==='demo'){card.style.top='300px';card.style.transform='none';}else{card.style.top='50%';card.style.transform='translateY(-50%)';}}
  const lt=t-c.t0;
  card._rows.forEach(r=>{const p=ease((lt-(+r.dataset.i||0)*.1)/.45);r.style.opacity=p;r.style.transform=`translateY(${(1-p)*46}px)`;});
  const sp=ease(lt/.22);sub.parentElement.style.opacity=sp;sub.textContent=c.sub||'';
  if(c.type==='demo'){demo.style.display='block';demo.style.opacity=ease(lt/.4);
    await new Promise(r=>{const h=()=>{dv.removeEventListener('seeked',h);r();};dv.addEventListener('seeked',h);dv.currentTime=Math.min(lt+(c.start||0),(dv.duration||99)-0.05);});
  } else demo.style.display='none';
};
document.body.dataset.ready='1';
</script></body></html>
